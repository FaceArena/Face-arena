name: Deploy FACE ARENA Cloudflare Preview

on:
  workflow_dispatch:
  push:
    branches:
      - server-sync-preview
    paths:
      - "workers/arena-coordinator/**"
      - ".github/workflows/deploy-cloudflare-preview.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy preview Worker
        working-directory: workers/arena-coordinator
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "05ac7140a70ea8feadd41b96a0e4ff3d"
