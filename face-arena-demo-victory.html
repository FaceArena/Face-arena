<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FACE ARENA — Кто красивее?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=block">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=block" rel="stylesheet">
<style>
:root{--bg:#050505;--s:#101010;--c:#151515;--tx:#fff;--mu:#8c8c8c;--red:#FF3434;--blue:#3478FF;
--hd:'Unbounded','Arial Black',system-ui,sans-serif;--bd:'Manrope',system-ui,-apple-system,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
/* Hide text until webfonts ready — prevents system→web font flash */
html:not(.fonts-ready) body{opacity:0}
html.fonts-ready body{opacity:1;transition:opacity .15s ease}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--bd);padding-bottom:88px;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;gap:8px}
.logo{font:800 14px var(--hd);letter-spacing:.12em;display:flex;align-items:center;gap:8px;min-width:0}
.logo i{display:flex}.logo i b{width:10px;height:18px;display:block}
.logo i b:first-child{background:var(--red);transform:skewX(-14deg)}.logo i b:last-child{background:var(--blue);transform:skewX(-14deg)}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;height:28px}
.btn-gear{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--mu);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn-gear:active{color:#fff;background:var(--s)}
.btn-gear svg{width:16px;height:16px;display:block}
.live{font:600 11px var(--bd);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px;height:28px;line-height:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h1{font:800 clamp(28px,8.5vw,72px)/.95 var(--hd);letter-spacing:-.02em;margin:16px 0 10px;text-transform:uppercase}
.lead{color:var(--mu);max-width:520px;margin:0 0 16px;font-size:14px;line-height:1.45}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--s);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 18px var(--hd)}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);contain:content}
@media(min-width:640px){.grid{gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--c);border-radius:16px;padding:10px;cursor:pointer;opacity:0;animation:in .22s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(min(var(--i),5)*20ms);transition:transform .18s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent;touch-action:manipulation;will-change:transform,opacity;transform:translateZ(0);contain:layout style}
@keyframes in{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.card:hover{transform:translateY(-2px)}.card:active{transform:scale(.97)}
.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.num{font:800 11px var(--hd);letter-spacing:.1em}
.chip{font:700 9px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--s);color:var(--mu)}
.chip.v{color:#fff}.chip.v::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:5px;animation:pulse 1.6s infinite}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:12px;overflow:hidden}
.ph{position:relative;aspect-ratio:3/4;background:var(--s);overflow:hidden;box-sizing:border-box}
.ph.R{
  background:radial-gradient(ellipse 80% 70% at 50% 45%,#5a1818 0%,#2a0808 55%,#120404 100%);
  box-shadow:inset 0 0 0 3px var(--red);
}
.ph.B{
  background:radial-gradient(ellipse 80% 70% at 50% 45%,#183a7a 0%,#081830 55%,#040812 100%);
  box-shadow:inset 0 0 0 3px var(--blue);
}
.ph img{
  width:100%;height:100%;object-fit:cover;object-position:center top;display:block;
  transition:transform .25s ease-out;transform:translateZ(0);
  /* soft vignette so subject sits on colored studio back */
  -webkit-mask-image:radial-gradient(ellipse 92% 88% at 50% 42%,#000 55%,transparent 100%);
  mask-image:radial-gradient(ellipse 92% 88% at 50% 42%,#000 55%,transparent 100%);
}
.ph.R img{mix-blend-mode:normal}
.ph.B img{mix-blend-mode:normal}
.card:hover .ph img{transform:scale(1.04)}
.side{position:absolute;left:6px;top:6px;font:800 10px var(--hd);letter-spacing:.08em;padding:3px 6px;border-radius:5px;color:#fff;z-index:1}
.R .side{background:var(--red)}.B .side{background:var(--blue)}
.nm{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:700;font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 11px var(--hd);box-shadow:0 0 0 2px var(--bg);transform:translate(-50%,-50%);z-index:2}
.bar{position:relative;height:5px;border-radius:99px;background:var(--blue);overflow:hidden;margin:10px 0 6px}
.bar u{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);transition:transform .6s ease-out;text-decoration:none}
.bar.zero{background:#262626}.bar.zero u{display:none}
.pct{display:flex;justify-content:space-between;align-items:center;font:700 10px var(--bd);gap:4px}
.pct .r{color:var(--red);flex-shrink:0}.pct .b{color:var(--blue);flex-shrink:0}.pct .m{color:var(--mu);font-weight:600;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{margin-top:8px;padding-top:8px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.tm small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tm b{font:800 16px var(--hd);font-variant-numeric:tabular-nums}
.tl{height:2px;background:#222;margin-top:6px;overflow:hidden;border-radius:2px}
.tl u{display:block;height:100%;background:#fff;transform-origin:left;transition:transform 1s linear;text-decoration:none}
nav{position:fixed;left:0;right:0;bottom:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:5}
.tabs{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:var(--mu);font:700 9px var(--bd);letter-spacing:.08em;text-transform:uppercase;padding:6px 0;display:grid;justify-items:center;gap:3px;min-height:44px;cursor:pointer;transition:color .22s;touch-action:manipulation}
.tabs button.on{color:#fff}
.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ind{position:absolute;top:0;left:0;width:25%;height:2px;display:flex;justify-content:center;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.ind::after{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--red),var(--blue))}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#fff;color:#000;font-weight:700;font-size:12px;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:6;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.back{background:none;border:0;color:var(--mu);font:700 12px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:14px 0 8px;min-height:44px;cursor:pointer;touch-action:manipulation}
.view,#av{opacity:0;transform:translate3d(0,6px,0);pointer-events:none;transition:opacity .15s ease-out,transform .15s ease-out;will-change:opacity,transform;backface-visibility:hidden}
.view.is-on,#av.is-on{opacity:1;transform:translate3d(0,0,0);pointer-events:auto}
.view.is-leave,#av.is-leave{opacity:0;transform:translate3d(0,-4px,0);pointer-events:none}
.view.is-on,#av.is-on{will-change:auto}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fadeScale{from{opacity:0;transform:scale3d(.98,.98,1)}to{opacity:1;transform:scale3d(1,1,1)}}
.card{animation-name:fadeUp}
.top-item{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),4)*18ms);transform:translateZ(0)}
.match-card{animation:fadeScale .18s ease-out;transform:translateZ(0)}
.q-item{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),5)*16ms);transform:translateZ(0)}
.settings-block{opacity:0;animation:fadeUp .18s ease-out forwards;animation-delay:calc(min(var(--i,0),3)*16ms)}
.pr-head,.pr-stats{opacity:0;animation:fadeUp .18s ease-out forwards}
.pr-head{animation-delay:12ms}.pr-stats{animation-delay:24ms}
html.no-anim .view,html.no-anim #av{transition:none!important;opacity:1!important;transform:none!important}
html.no-anim .top-item,html.no-anim .q-item,html.no-anim .settings-block,html.no-anim .pr-head,html.no-anim .pr-stats,html.no-anim .match-card{animation:none!important;opacity:1!important}
.big{max-width:640px;margin:0 auto}
.big .duel{border-radius:16px;gap:3px}
.big .ph{aspect-ratio:3/4}
.big .nm{font-size:15px;padding:28px 12px 10px}
.big .vs{width:48px;height:48px;margin:0;font-size:14px;box-shadow:0 0 0 3px var(--bg);transform:translate(-50%,-50%)}
.big .bar{height:7px;margin-top:14px}
.big .side{left:8px;top:8px;font-size:11px;padding:4px 8px}
.big .pct{font-size:13px}
.big .tm b{font-size:22px}
.big .tm small{font-size:11px}
.note{color:var(--mu);font-size:12px;margin:10px 0 0;line-height:1.4}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
.pick{border:0;border-radius:14px;padding:16px 8px;min-height:52px;color:#fff;font:800 12px var(--hd);letter-spacing:.06em;cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.2,1);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pick:active{transform:scale(.96)}.pick.R{background:var(--red)}.pick.B{background:var(--blue)}
h2{font:800 15px var(--hd);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 10px}
.cms{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cm{background:var(--c);border-radius:12px;padding:11px 12px;border-left:3px solid;animation:in .45s both;animation-delay:calc(var(--i)*60ms)}
.cm.R{border-color:var(--red)}.cm.B{border-color:var(--blue)}
.cm b{font-size:13px}.cm .tg{font:800 10px var(--hd);margin-left:8px;letter-spacing:.1em}
.cm.R .tg{color:var(--red)}.cm.B .tg{color:var(--blue)}.cm p{margin:4px 0 0;color:#cfcfcf;font-size:13px;line-height:1.35}
.empty{background:var(--c);border-radius:12px;padding:20px;text-align:center;color:var(--mu);font-size:13px}
.big .nm{display:flex;align-items:center;gap:8px}
.av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:var(--s)}
.av img{width:100%;height:100%;object-fit:cover;transform:scale(2.4);transform-origin:50% 42%}
.nk{background:none;border:0;color:#fff;font:700 14px var(--bd);padding:4px 0;min-height:40px;cursor:pointer;transition:opacity .2s;touch-action:manipulation}.nk:hover{opacity:.7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s);border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.ov.on .sh{transform:none}
.sh h3{font:800 15px var(--hd);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
textarea{width:100%;background:var(--c);color:#fff;border:0;border-radius:12px;padding:12px;font:400 16px/1.4 var(--bd);resize:none;margin-top:10px}
textarea:focus{outline:2px solid #fff}
.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0 12px;min-height:18px}
.err{color:#ffb454;font-size:12px;font-weight:600;text-align:right}
.send,.cancel{width:100%;border:0;border-radius:12px;min-height:50px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;cursor:pointer;touch-action:manipulation}
.send:disabled{opacity:.55}.cancel{background:none;color:var(--mu);margin-top:4px;font-family:var(--bd);font-weight:700}
.done{background:var(--c);border-radius:12px;padding:12px;margin:16px 0 8px;font-weight:600;font-size:14px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1}}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation:none!important;transition:none!important}
html.no-anim .card{opacity:1}
/* Settings — full-screen menu style */
#sv.settings-menu{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));min-height:100vh}
.settings-menu-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.settings-menu-list li{margin:0}
.settings-menu-list a,.settings-menu-list button.menu-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  color:#ececec;font:400 18px/1.3 var(--bd);
  padding:20px 6px;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;transition:color .15s,opacity .15s;
}
.settings-menu-list a:active,.settings-menu-list button.menu-item:active{opacity:.55}
.settings-menu-list .menu-item.danger{color:#ff6b6b}
.settings-menu-sep{height:1px;background:#222;margin:18px 0 10px}
.settings-menu-foot{margin-top:28px;padding-top:8px;text-align:center}
.settings-menu-foot .menu-exit{
  background:none;border:0;color:#cfcfcf;font:400 16px var(--bd);
  padding:16px 12px;cursor:pointer;touch-action:manipulation;
}
.settings-menu-foot .menu-exit:active{opacity:.55}
.settings-sub{display:none}
.settings-sub.on{display:block}
.settings-sub .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #222;min-height:52px}
.settings-sub .set-row:first-of-type{border-top:0;padding-top:4px}
.settings-sub .lbl{font-size:15px;font-weight:600}
.settings-sub .sub{font-size:12px;color:var(--mu);margin-top:3px}
.settings-sub input[type=text]{width:100%;max-width:180px;background:var(--s);border:0;border-radius:10px;padding:11px 12px;color:#fff;font:600 14px var(--bd)}
.settings-sub input:focus{outline:2px solid #fff}
.set-toggle{position:relative;width:48px;height:28px;border-radius:99px;background:#333;border:0;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.set-toggle.on{background:var(--blue)}
.set-toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.set-toggle.on::after{transform:translateX(20px)}
.btn-danger{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;background:#5a1010;cursor:pointer;touch-action:manipulation;margin-top:8px}
.btn-main{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;background:var(--blue);cursor:pointer;touch-action:manipulation;margin-top:12px}
.set-info{font-size:13px;color:var(--mu);line-height:1.5;margin:0 0 12px}
.settings-back{background:none;border:0;color:var(--mu);font:700 12px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:14px 0 6px;min-height:44px;cursor:pointer;touch-action:manipulation}
.sec-h{font:800 22px var(--hd);letter-spacing:-.01em;text-transform:uppercase;margin:8px 0 6px}
.sec-lead{color:var(--mu);font-size:13px;margin:0 0 16px;line-height:1.4}
.q-pos{background:var(--c);border-radius:16px;padding:18px 16px;margin-bottom:14px;text-align:center}
.q-pos .big-n{font:800 42px var(--hd);line-height:1;letter-spacing:-.03em}
.q-pos .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.q-meta{display:flex;gap:8px;margin-bottom:16px}
.q-meta .stat{flex:1;text-align:center}
.status-pill{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--bd);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:var(--s)}
.status-pill.queued{color:#ffb454}.status-pill.matched{color:var(--blue)}.status-pill.confirmed{color:#a78bfa}.status-pill.voting{color:#fff;background:var(--red)}
.status-pill.completed{color:#4ade80}.status-pill.cancelled{color:var(--mu)}
.status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.q-list{display:grid;gap:10px}
.q-item{background:var(--c);border-radius:14px;padding:10px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.q-item img{width:64px;height:80px;object-fit:cover;border-radius:10px;background:var(--s);box-sizing:border-box}
.q-item img.frame-R{box-shadow:inset 0 0 0 2px var(--red)}
.q-item img.frame-B{box-shadow:inset 0 0 0 2px var(--blue)}
.my-photos .ph-card.frame-R{box-shadow:inset 0 0 0 3px var(--red)}
.my-photos .ph-card.frame-B{box-shadow:inset 0 0 0 3px var(--blue)}
.q-item .info b{display:block;font-size:13px;margin-bottom:2px}
.q-item .info span{font-size:11px;color:var(--mu)}
.q-item .st{font:700 10px var(--bd);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.q-item .acts{display:flex;flex-direction:column;gap:4px}
.q-item .acts button{border:0;border-radius:8px;padding:6px 10px;font:700 10px var(--bd);cursor:pointer;touch-action:manipulation}
.btn-sm-blue{background:var(--blue);color:#fff}
.btn-sm-muted{background:var(--s);color:var(--mu)}
.empty-box{background:var(--c);border-radius:16px;padding:28px 16px;text-align:center;color:var(--mu)}
.empty-box p{margin:8px 0 0;font-size:13px;line-height:1.4}
.up-zone{background:var(--c);border:2px dashed #333;border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;touch-action:manipulation}
.up-zone:active{border-color:var(--blue);background:#0a1220}
.up-zone input{display:none}
.up-zone .ic{font-size:28px;margin-bottom:8px;opacity:.7}
.up-zone b{display:block;font:700 14px var(--bd);margin-bottom:4px}
.up-zone span{font-size:12px;color:var(--mu)}
.preview-box{background:var(--c);border-radius:16px;overflow:hidden;margin-bottom:14px}
.preview-box img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;max-height:360px}
.preview-box .act{display:flex;gap:8px;padding:12px}
.preview-box .act button{flex:1;border:0;border-radius:12px;min-height:48px;font:800 12px var(--hd);letter-spacing:.05em;cursor:pointer;touch-action:manipulation}
.preview-box .act .rep{background:var(--s);color:#fff}
.preview-box .act .add{background:var(--blue);color:#fff}
.limit-note{font-size:12px;color:var(--mu);margin:8px 0 0;text-align:center}
.my-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.my-photos .ph-card{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--s)}
.my-photos .ph-card img{width:100%;height:100%;object-fit:cover}
.my-photos .ph-card .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.pr-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pr-av{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--s);flex:none}

.pr-stats .stat{text-align:center;padding:12px 8px}
.pr-stats .stat b{font-size:20px}
.hist{display:grid;gap:10px}
.hist-item{background:var(--c);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:pointer;touch-action:manipulation}
.hist-item:active{opacity:.85}
.hist-item .sides{display:flex;align-items:center;gap:8px}
.hist-item .sides img{width:40px;height:50px;object-fit:cover;border-radius:8px}
.hist-item .vs-s{font:800 10px var(--hd);color:var(--mu)}
.hist-item .res{font:800 12px var(--hd);letter-spacing:.06em}
.hist-item .res.win{color:#4ade80}.hist-item .res.lose{color:var(--red)}.hist-item .res.draw{color:var(--mu)}.hist-item .res.red{color:var(--red)}.hist-item .res.blue{color:var(--blue)}
.champion-tag{display:inline-block;font:700 9px var(--bd);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#3a3010;color:#f0d060;margin-left:6px;vertical-align:middle}
.btn-main{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);letter-spacing:.06em;color:#fff;background:var(--blue);cursor:pointer;touch-action:manipulation;margin-top:12px}
.btn-main:disabled{opacity:.5}
.btn-ghost{width:100%;border:0;border-radius:14px;min-height:48px;font:700 13px var(--bd);color:var(--mu);background:none;cursor:pointer;margin-top:6px}
.match-card{background:var(--c);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:16px}
.match-card .countdown{font:800 48px var(--hd);line-height:1;margin:12px 0 4px;color:var(--blue)}
.match-card .cd-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.match-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.match-duel img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:12px}
.match-duel>div:first-child img{background:radial-gradient(ellipse 80% 70% at 50% 45%,#5a1818,#120404);box-shadow:inset 0 0 0 2px var(--red)}
.match-duel>div:last-child img{background:radial-gradient(ellipse 80% 70% at 50% 45%,#183a7a,#040812);box-shadow:inset 0 0 0 2px var(--blue)}
.btn-cancel-match{width:100%;border:0;border-radius:14px;min-height:52px;font:800 13px var(--hd);background:var(--red);color:#fff;cursor:pointer;touch-action:manipulation}
.btn-confirm-ok{width:100%;border:0;border-radius:14px;min-height:48px;font:700 13px var(--bd);background:var(--s);color:#fff;cursor:pointer;margin-top:8px}

.champ-badge{position:absolute;right:6px;top:6px;z-index:2;font:800 9px var(--hd);letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:linear-gradient(135deg,#c9a227,#f0d060);color:#1a1200}

.top-arena h2{font:800 13px var(--hd);letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.top-arena h2 span{color:#f0d060}

.lane-label{font:700 9px var(--bd);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}


/* Dominance / fight pulse */
.ph.dom{z-index:1}
.ph.dom img{animation:domPulse 1.6s ease-in-out infinite}
.ph.weak img{filter:brightness(.72) saturate(.85);transform:scale(.97)}
.ph.dom::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 0 0 transparent;animation:domGlow 1.6s ease-in-out infinite}
.ph.R.dom::after{box-shadow:inset 0 0 24px rgba(255,52,52,.35)}
.ph.B.dom::after{box-shadow:inset 0 0 24px rgba(52,120,255,.35)}
@keyframes domPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes domGlow{0%,100%{opacity:.55}50%{opacity:1}}
.vs.push-r{animation:vsPushR 1.2s ease-in-out infinite}
.vs.push-b{animation:vsPushB 1.2s ease-in-out infinite}
@keyframes vsPushR{0%,100%{transform:translate(-45%,-50%)}50%{transform:translate(-58%,-50%)}}
@keyframes vsPushB{0%,100%{transform:translate(-55%,-50%)}50%{transform:translate(-42%,-50%)}}
.bar.fight{height:6px;box-shadow:0 0 10px rgba(255,52,52,.2),inset 0 0 0 0 transparent;overflow:visible}
.big .bar.fight{height:9px}
.bar.fight u{
  background:linear-gradient(90deg,#ff1a1a 0%,#FF3434 70%,#ff6b4a 100%);
  animation:barStruggle 1s ease-in-out infinite;
  box-shadow:2px 0 8px rgba(255,52,52,.55);
}
.bar.fight{background:linear-gradient(90deg,#1a4dff,#3478FF 40%,#5a9fff)}
.bar.fight .clash{
  position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;margin-left:-5px;
  border-radius:50%;background:#fff;z-index:3;pointer-events:none;
  box-shadow:0 0 6px #fff,0 0 14px #FF3434,0 0 18px #3478FF;
  animation:clashSpark .7s ease-in-out infinite;
  left:calc(var(--p,50)*1%);
}
.bar.fight .clash::before,.bar.fight .clash::after{
  content:"";position:absolute;top:50%;left:50%;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
}
.bar.fight .clash::before{width:18px;height:18px;border:1px solid rgba(255,255,255,.45);animation:clashRing .7s ease-out infinite}
.bar.fight .clash::after{width:4px;height:16px;background:linear-gradient(180deg,transparent,#fff,transparent);opacity:.8;animation:clashBolt .7s ease-in-out infinite}
@keyframes barStruggle{
  0%,100%{filter:brightness(1) saturate(1)}
  50%{filter:brightness(1.25) saturate(1.15)}
}
@keyframes clashSpark{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:.85}
}
@keyframes clashRing{
  0%{transform:translate(-50%,-50%) scale(.6);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}
}
@keyframes clashBolt{
  0%,100%{opacity:.35;height:12px}
  50%{opacity:1;height:20px}
}
html.no-anim .bar.fight .clash,html.no-anim .bar.fight .clash::before,html.no-anim .bar.fight .clash::after{animation:none!important;display:none}
.pct .r.lead,.pct .b.lead{animation:pctFlash 1.5s ease-in-out infinite}
@keyframes pctFlash{0%,100%{opacity:1}50%{opacity:.7}}
html.no-anim .ph.dom img,html.no-anim .ph.dom::after,html.no-anim .vs.push-r,html.no-anim .vs.push-b,
html.no-anim .bar.fight u,html.no-anim .bar.fight .clash,html.no-anim .pct .r.lead,html.no-anim .pct .b.lead{animation:none!important}

/* Showcase victory overlay */
.victory-overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .35s ease}
.victory-overlay.on{opacity:1;pointer-events:auto}
.victory-panel{position:relative;width:min(100%,420px);text-align:center;padding:26px 20px 22px;border:1px solid rgba(52,120,255,.55);border-radius:24px;background:radial-gradient(ellipse at 50% 0%,rgba(52,120,255,.25),transparent 58%),#090b11;box-shadow:0 0 70px rgba(52,120,255,.22);overflow:hidden;transform:translateY(22px) scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.victory-overlay.on .victory-panel{transform:translateY(0) scale(1)}
.victory-kicker{font:800 10px var(--hd);letter-spacing:.24em;color:#8bb4ff}
.victory-title{font:800 clamp(27px,8vw,40px)/1.05 var(--hd);margin:10px 0 6px;color:#fff;text-shadow:0 0 24px rgba(52,120,255,.7)}
.victory-photo{width:min(56vw,210px);aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:18px;border:2px solid var(--blue);box-shadow:0 0 0 7px rgba(52,120,255,.1),0 0 42px rgba(52,120,255,.45);animation:victoryRise .8s cubic-bezier(.2,.8,.2,1) both}
.victory-name{font:800 18px var(--hd);margin:14px 0 4px;color:#fff}
.victory-sub{font-size:11px;letter-spacing:.16em;color:#8bb4ff;text-transform:uppercase}
.victory-close{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--blue);color:white;font:800 12px var(--hd);letter-spacing:.08em}
.victory-rays{position:absolute;inset:-45%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(52,120,255,.11) 0deg 7deg,transparent 7deg 16deg);animation:victorySpin 18s linear infinite}
@keyframes victoryRise{from{opacity:0;transform:translateY(28px) scale(.82)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes victorySpin{to{transform:rotate(360deg)}}
html.no-anim .victory-rays{animation:none}
html.no-anim .victory-photo{animation:none}
html.no-anim .victory-overlay,html.no-anim .victory-panel{transition:none}

const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/>${long?`<ellipse cx="150" cy="175" rx="92" ry="110" fill="${hr}"/>`:""}<path d="M25 400c0-75 55-110 125-110s125 35 125 110z" fill="${cl}"/><rect x="125" y="245" width="50" height="70" rx="16" fill="${sk}"/><ellipse cx="150" cy="185" rx="62" ry="78" fill="${sk}"/><path d="M85 175c-5-58 28-82 65-82s70 24 65 82c-12-28-32-42-65-42s-52 14-65 42z" fill="${hr}"/><circle cx="126" cy="188" r="4.5" fill="#1a1a1a"/><circle cx="174" cy="188" r="4.5" fill="#1a1a1a"/><path d="M132 228q18 14 36 0" stroke="#7a3b2e" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
return "data:image/svg+xml,"+encodeURIComponent(svg)}

const MAX_ACTIVE=3, MAX_SIZE=5*1024*1024, MATCH_SEC=10, STAGE_SEC=70, MAX_BATTLES=10;
function arenaNow(){return window.FaceArenaSync?.isOnline?.()&&typeof window.FaceArenaSync.serverNow==="function"?window.FaceArenaSync.serverNow():Date.now()}
const ACTIVE_STATUSES=new Set(["queued","matched","confirmed","voting","champion"]);
const LS_KEY="face_arena_demo_v2";
let photos=[];
let arenaBattles=[];
let history=[];
let arenaResults=[];
// Votes & comments keyed by immutable battleUid (NOT slot id)
let VOTED=new Set(); // Set of battleUid strings
let MY={}; // { [battleUid]: [{s,v}] }
let pendingUrl=null, pendingFile=null;
let matchTimerId=null;
let profile={name:"Вы",handle:"user"}
let prefAnim=true;
let participantStats={}; // photoId -> {wins,losses,defenses,bestStreak,name,img}
let _uidSeq=0;
function newBattleUid(){return "b_"+Date.now().toString(36)+"_"+((++_uidSeq)%1e6).toString(36)+"_"+Math.random().toString(36).slice(2,7)}

function saveState(){
  try{
    const data={
      v:3,
      photos, history, profile, prefAnim, _uidSeq, participantStats,
      arenaBattles:arenaBattles.map(b=>({...b})),
      voted:[...VOTED],
      my:MY,
      savedAt:Date.now()
    };
    localStorage.setItem(LS_KEY,JSON.stringify(data));
  }catch(e){
    toast("Не удалось сохранить: память браузера переполнена или недоступна");
  }
}
function loadState(){
  try{
    // migrate from v1 if needed
    let raw=localStorage.getItem(LS_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data||!Array.isArray(data.photos)||!Array.isArray(data.arenaBattles))return false;
    photos=window.FaceArenaGameEngine?window.FaceArenaGameEngine.normalizeQueue(data.photos||[]):(data.photos||[]);
    history=data.history||[];
    arenaBattles=(data.arenaBattles||[]).map(b=>{
      b={...b};
      if(b.stage==="w"||b.stage==="v"){
        const oldDuration=STAGE_SEC*1000;
        const started=typeof b.stageStarted==="number"&&b.stageStarted>0?b.stageStarted:(typeof b.stageEnd==="number"&&b.stageEnd>1e12?b.stageEnd-oldDuration:Date.now());
        b.stageStarted=started;
        b.stageEnd=Math.min(typeof b.stageEnd==="number"&&b.stageEnd>1e12?b.stageEnd:started+oldDuration,started+STAGE_SEC*1000);
        b.totalStage=STAGE_SEC;
      }
      return b;
    });
    VOTED=new Set(data.voted||[]);
    MY=data.my||{};
    profile=data.profile||{name:"Вы",handle:"user"};
    prefAnim=data.prefAnim!==false;
    _uidSeq=data._uidSeq||0;
    participantStats=data.participantStats||{};
    // Ensure every active battle has a battleUid
    arenaBattles.forEach(b=>{
      if((b.stage==="w"||b.stage==="v")&&!b.battleUid){
        b.battleUid=newBattleUid();
      }
    });
    applyAnimPref();
    return true;
  }catch(e){return false}
}
function resetData(){
  if(!confirm("Сбросить все данные?\\n\\nБудут удалены фото, голоса, комментарии, история и настройки профиля."))return;
  localStorage.removeItem(LS_KEY);location.hash="";location.reload();
}
function applyAnimPref(){
  const root=document.documentElement;
  if(!prefAnim||window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    root.classList.add("no-anim");
  } else {
    root.classList.remove("no-anim");
  }
}

function createDefaultArena(){
  return Array.from({length:MAX_BATTLES},(_,i)=>({id:i+1,laneId:i+1,battleUid:null,isMock:false,userPhotoId:null,redName:"—",blueName:"—",redVotes:0,blueVotes:0,stage:"empty",stageEnd:0,stageStarted:0,totalStage:STAGE_SEC,championPhotoId:null,championSide:null,championStreak:0,championName:null,championImg:null}));
}
(function initArena(){
  if(!loadState())arenaBattles=createDefaultArena();
  const isDemoId=id=>/^(demo[_-]|mock[_-]|bot[_-])/i.test(String(id||""));
  photos=photos.filter(p=>!isDemoId(p.id)&&!p.isDemo&&!p.demoOnly);
  history=history.filter(h=>!isDemoId(h.photoId));
  Object.keys(participantStats).forEach(id=>{if(isDemoId(id)||participantStats[id]?.isDemo||participantStats[id]?.demoOnly)delete participantStats[id]});
  const byId=id=>photos.find(p=>String(p.id)===String(id));
  arenaBattles=arenaBattles.map((b,i)=>{
    const userPhoto=byId(b.userPhotoId),championIsDemo=isDemoId(b.championPhotoId);
    if(userPhoto&&(b.isMock||b.demoShowcase||championIsDemo||!b.championPhotoId))Object.assign(userPhoto,{status:"queued",battleId:null,battleUid:null,targetLaneId:null,matchedAt:null,matchDeadline:null,side:null,opponentName:null,opponentImg:null});
    if(b.isMock||b.demoShowcase||championIsDemo||(!b.userPhotoId&&!b.championPhotoId)||(userPhoto&&!b.championPhotoId))return {id:b.id||i+1,laneId:b.id||i+1,battleUid:null,isMock:false,userPhotoId:null,redName:"—",blueName:"—",redVotes:0,blueVotes:0,stage:"empty",stageEnd:0,stageStarted:0,totalStage:STAGE_SEC,championPhotoId:null,championSide:null,championStreak:0,championName:null,championImg:null};
    b.isMock=false;b.victoryPending=false;b.victoryShown=false;return b;
  });
  saveState();
})();

function activeCount(){return photos.filter(p=>ACTIVE_STATUSES.has(p.status)).length}
function queuedPhotos(){return photos.filter(p=>p.status==="queued")}
function updateArenaStats(){
  const activePairs=arenaBattles.filter(b=>b.stage==="w"||b.stage==="v").length;
  const waiting=photos.filter(p=>p.status==="queued").length;
  $("stats").innerHTML=`<div class="stat"><b>${activePairs} ${t("of")} ${MAX_BATTLES}</b><span>${t("slots")}</span></div><div class="stat"><b>${waiting}</b><span>${t("queue")}</span></div>`;

function buildTopRanking(){
  if(window.FaceArenaGameEngine){
    return window.FaceArenaGameEngine.buildRanking(participantStats,photos).map(r=>({
      ...r,name:r.name||profile.name||"Вы",img:r.img||face(1,"R")
    }));
  }
  return Object.keys(participantStats).filter(id=>!/^demo[_-]|^mock[_-]|^bot[_-]/i.test(id)).map(id=>{
    const s=participantStats[id],photo=photos.find(x=>String(x.id)===String(id));
    return {id,name:s.name||profile.name||"Вы",img:s.img||(photo&&photo.dataUrl)||face(1,"R"),wins:s.wins||0,losses:s.losses||0,defenses:s.defenses||0,streak:s.currentStreak||0,best:s.bestStreak||0,isChampion:!!s.isChampion||!!(photo&&photo.status==="champion"),laneId:s.laneId||null};
  }).sort((a,b)=>Number(b.isChampion)-Number(a.isChampion)||b.defenses-a.defenses||b.wins-a.wins||b.streak-a.streak||String(a.id).localeCompare(String(b.id)));
}

function ensureStats(photoId, name, img){
  const k=String(photoId);
  if(!participantStats[k]) participantStats[k]={wins:0,losses:0,defenses:0,bestStreak:0,currentStreak:0,name:name||"Участник",img:img||"",isChampion:false,laneId:null};
  return participantStats[k];
}
function cancelInactiveBattle(b,now){
  if(window.FaceArenaGameEngine){
    const cancelled=window.FaceArenaGameEngine.cancelBattle({photos,lanes:arenaBattles,history,participantStats},b.id,now);
    if(!cancelled.changed)return false;
    photos=cancelled.state.photos;
    arenaBattles=cancelled.state.lanes;
    history=cancelled.state.history;
    participantStats=cancelled.state.participantStats;
    return true;
  }
  // Defensive fallback for a missing engine script: never leave a dead lane occupied.
  const p=b.userPhotoId?photos.find(x=>String(x.id)===String(b.userPhotoId)):null;
  if(p){
    p.status="queued";p.battleId=null;p.battleUid=null;p.targetLaneId=null;
    p.matchedAt=null;p.matchDeadline=null;p.completedAt=null;
    p.side=null;p.opponentName=null;p.opponentImg=null;
  }
  b.userPhotoId=null;b.stage="done";b._finalized=true;
  b.redVotes=0;b.blueVotes=0;
  return true;
}
function finishBattle(b,now){
  if(b.stage!=="w"&&b.stage!=="v")return false;
  if(b._finalized)return false;
  if(b.stage==="w"){
    if(!cancelInactiveBattle(b,now))return false;
    // The participant returns to FIFO; tickArena() immediately refills released lanes.
    return true;
  }
  const tot=b.redVotes+b.blueVotes;
  if(tot===0){
    if(!cancelInactiveBattle(b,now))return false;
    // The participant returns to FIFO; tickArena() immediately refills released lanes.
    return true;
  }
  b.stage="done";b._finalized=true;
  // Determine winning side
  let winSide="draw";
  if(b.redVotes>b.blueVotes)winSide="R";
  else if(b.blueVotes>b.redVotes)winSide="B";

  const p=b.userPhotoId?photos.find(x=>String(x.id)===String(b.userPhotoId)):null;
  if(p&&p.status==="voting"&&window.FaceArenaGameEngine){
    if(!p.name)p.name=profile.name||"Вы";
    const wasChampion=String(b.championPhotoId||"")===String(p.id);
    const resolved=window.FaceArenaGameEngine.resolveBattle({photos,lanes:arenaBattles,history,participantStats},b.id,now);
    if(!resolved.changed)return false;
    photos=resolved.state.photos;arenaBattles=resolved.state.lanes;history=resolved.state.history;participantStats=resolved.state.participantStats;
    if(resolved.result.outcome==="win")window.FaceArenaAudio?.play(wasChampion?"victory":"champion");
    else if(resolved.result.outcome==="lose")window.FaceArenaAudio?.play(wasChampion?"titleLost":"defeat");
    return true;
  }
  if(p&&(p.status==="voting"||p.status==="confirmed"||p.status==="champion")){
    const myV=p.side==="R"?b.redVotes:b.blueVotes, oppV=p.side==="R"?b.blueVotes:b.redVotes;
    let res="draw";if(myV>oppV)res="win";else if(myV<oppV)res="lose";
    const wasChampion=String(b.championPhotoId||"")===String(p.id);
    const st=ensureStats(p.id, profile.name||"Вы", p.dataUrl);
    if(res==="win"){
      window.FaceArenaAudio?.play(wasChampion?"victory":"champion");
      st.wins++;st.currentStreak=(st.currentStreak||0)+1;st.bestStreak=Math.max(st.bestStreak||0,st.currentStreak);
      // User becomes/stays champion of this lane
      if(b.championPhotoId&&String(b.championPhotoId)===String(p.id)){
        st.defenses=(st.defenses||0)+1;
        b.championStreak=(b.championStreak||0)+1;
      } else {
        // Challenger takes the title; archive the former user champion exactly once.
        if(b.championPhotoId!=null){
          const former=photos.find(x=>String(x.id)===String(b.championPhotoId));
          if(former&&String(former.id)!==String(p.id)&&former.status==="champion"){
            former.status="completed";former.result="lose";former.completedAt=now;former.battleId=null;
            former.myVotes=oppV;former.oppVotes=myV;
            const formerStats=ensureStats(former.id,profile.name||"Вы",former.dataUrl);
            formerStats.losses=(formerStats.losses||0)+1;formerStats.currentStreak=0;formerStats.isChampion=false;formerStats.laneId=null;
            if(!history.some(h=>String(h.battleUid)===String(b.battleUid)&&String(h.photoId)===String(former.id))){
              history.unshift({photoId:former.id,battleId:b.id,battleUid:b.battleUid,laneId:b.id,side:former.side,result:"lose",myVotes:oppV,oppVotes:myV,opponentName:profile.name||"Вы",opponentImg:p.dataUrl,completedAt:now,myImg:former.dataUrl,championAfter:false});
            }
          }
        }
        b.championPhotoId=p.id;
        b.championSide=p.side;
        b.championStreak=1;
        b.championName=profile.name||"Вы";
        b.championImg=p.dataUrl;
      }
      st.isChampion=true;st.laneId=b.id;
      p.status="champion"; // still active, holds title
      p.battleId=b.id;p.result=res;p.myVotes=myV;p.oppVotes=oppV;
      p.completedAt=null;
      // Opponent mock loses — no photo record
    } else if(res==="lose"){
      window.FaceArenaAudio?.play(wasChampion?"titleLost":"defeat");
      st.losses++;st.currentStreak=0;st.isChampion=false;st.laneId=null;
      p.status="completed";p.result=res;p.myVotes=myV;p.oppVotes=oppV;p.completedAt=now;p.battleId=null;
      // Title goes to mock opponent side — clear user championship on lane, keep lane open for next
      if(b.championPhotoId&&String(b.championPhotoId)===String(p.id)){
        b.championPhotoId=null;b.championSide=null;b.championStreak=0;b.championName=null;b.championImg=null;
      } else {
        // user was challenger and lost — existing champion (mock) remains; no user champ
      }
    } else {
      // draw — no title change; user photo completes without streak
      p.status="completed";p.result=res;p.myVotes=myV;p.oppVotes=oppV;p.completedAt=now;p.battleId=null;
    }
    history.unshift({photoId:p.id,battleId:b.id,battleUid:b.battleUid,laneId:b.id,side:p.side,result:res,myVotes:myV,oppVotes:oppV,opponentName:p.opponentName,opponentImg:p.opponentImg,completedAt:now,myImg:p.dataUrl,championAfter:p.status==="champion"});
  } else if(winSide!=="draw"&&b.championPhotoId){
    // Mock battle with real champion defending vs mock — rare path
    const st=ensureStats(b.championPhotoId,b.championName,b.championImg);
    if((winSide==="R"&&b.championSide==="R")||(winSide==="B"&&b.championSide==="B")){
      st.wins++;st.defenses++;st.currentStreak++;st.bestStreak=Math.max(st.bestStreak,st.currentStreak);
      b.championStreak=(b.championStreak||0)+1;
    }
  }
  // Clear active battle link for next challenger assignment but keep champion on lane
  b.userPhotoId=null;
  b.redVotes=0;b.blueVotes=0;
  return true;
}
function tryFillSlots(){
  if(window.FaceArenaSync?.isOnline())return;
  const now=Date.now();
  const waitingMatched=photos.filter(p=>p.status==="matched"&&p.matchDeadline&&p.matchDeadline<=now&&!p._confirming);
  waitingMatched.forEach(p=>confirmMatch(p));
  if(!window.FaceArenaGameEngine)return;
  let guard=0;
  while(guard++<MAX_BATTLES){
    const assignment=window.FaceArenaGameEngine.selectNextAssignment(photos,arenaBattles);
    if(!assignment)break;
    const p=photos.find(x=>String(x.id)===String(assignment.photoId));
    const lane=arenaBattles.find(x=>String(x.id)===String(assignment.laneId));
    if(!p||!lane)break;
    p.status="matched";p.targetLaneId=lane.id;p.matchedAt=now;p.matchDeadline=now+MATCH_SEC*1000;
    if(assignment.opening){
      const opponent=photos.find(x=>String(x.id)===String(assignment.opponentPhotoId));
      if(!opponent||opponent.status!=="queued"||(opponent.userId||opponent.ownerId||"__local_user__")===(p.userId||p.ownerId||"__local_user__")){
        p.status="queued";p.targetLaneId=null;p.matchedAt=null;p.matchDeadline=null;break;
      }
      p.side="R";p.opponentName=opponent.name||"Участник";p.opponentImg=opponent.dataUrl||"";
      p.openingOpponentPhotoId=opponent.id;
      opponent.status="matched";opponent.targetLaneId=lane.id;opponent.matchedAt=now;opponent.matchDeadline=p.matchDeadline;
      opponent.openingPairPrimaryId=p.id;opponent.side="B";opponent.opponentName=p.name||profile.name||"Участник";opponent.opponentImg=p.dataUrl||"";
    }else if(lane.championPhotoId){
      p.opponentName=lane.championName||"Чемпион";p.opponentImg=lane.championImg||face(1,"B");
      p.side=lane.championSide==="R"?"B":"R";
    }else{
      p.status="queued";p.targetLaneId=null;p.matchedAt=null;p.matchDeadline=null;p._confirming=false;break;
    }
    p._confirming=false;
    window.FaceArenaAudio?.play("matchFound");
  }
}
function tickArena(){
  const now=arenaNow();
  if(window.FaceArenaSync?.isOnline()){
    if(arenaBattles.some(b=>b.stage==="m"&&b.confirmUntil&&b.confirmUntil<=now)&&!window._faConfirmRefresh){
      window._faConfirmRefresh=true;
      window.FaceArenaSync.loadSnapshot().finally(()=>{window._faConfirmRefresh=false});
    }
    if(!$("av").hidden){
      document.querySelectorAll(".card[data-id]").forEach(card=>{
        const b=arenaBattles.find(x=>x.id===+card.dataset.id);
        if(!b||(b.stage!=="m"&&b.stage!=="w"&&b.stage!=="v"))return;
        const left=Math.max(0,Math.ceil((b.stageEnd-now)/1000));
        const cd=card.querySelector(".cd");if(cd)cd.textContent=fmt(left);
        const bar=card.querySelector(".tl u");if(bar)bar.style.transform=`scaleX(${Math.min(1,left/STAGE_SEC)})`;
      });
    }
    return;
  }
  let changed=false;
  arenaBattles.forEach(b=>{
    if(b.stage!=="w"&&b.stage!=="v")return;
    if(b.stageEnd>now)return;
    if(finishBattle(b,now))changed=true;
  });
  photos.forEach(p=>{
    if(p.status==="matched"&&p.matchDeadline&&p.matchDeadline<=now&&!p._confirming){
      confirmMatch(p);changed=true;
    }
  });
  // Live update countdown labels on arena grid (without full re-render)
  if(!$("av").hidden){
    document.querySelectorAll(".card[data-id]").forEach(card=>{
      const id=+card.dataset.id;
      const b=arenaBattles.find(x=>x.id===id);
      if(!b||(b.stage!=="w"&&b.stage!=="v"))return;
      const left=Math.max(0,Math.ceil((b.stageEnd-now)/1000));
      const cd=card.querySelector(".cd");
      if(cd)cd.textContent=fmt(left);
      const bar=card.querySelector(".tl u");
      if(bar)bar.style.transform=`scaleX(${Math.min(1,left/STAGE_SEC)})`;
    });
  }
  if(changed){
    tryFillSlots();
    saveState();
    if(!$("av").hidden)renderArenaGrid();
    if(!$("qv").hidden)renderQueue();
  }
}

async function submit(n){
  if(busy)return;
  const v=$("ct").value.trim();
  if(!v){$("er").textContent=t("e0");return}
  if(v.length<10){$("er").textContent=t("e1");return}
  if(v.length>300){$("er").textContent="Максимум 300 символов";return}
  const b=arenaBattles.find(x=>x.id===n);
  if(!b||b.stage!=="v"){toast(t("closed"));return}
  if(!b.battleUid)b.battleUid=newBattleUid();
  const uid=b.battleUid;
  if(VOTED.has(uid)){$("er").textContent=t("dup");return}
  if(b.stageEnd<=arenaNow()){toast(t("closed"));return}
  busy=true;$("sd").textContent=t("sending");$("sd").disabled=true;
  // Final validation immediately before mutation
  const b2=arenaBattles.find(x=>x.id===n);
  if(!b2||b2.stage!=="v"||b2.stageEnd<=arenaNow()||!b2.battleUid||VOTED.has(b2.battleUid)){
    busy=false;toast(t("closed"));closeV();return;
  }
  if(window.FaceArenaSync?.isOnline()){
    const targetPhotoId=side==="R"?b2.redPhotoId:b2.bluePhotoId;
    if(!targetPhotoId){busy=false;toast("Не удалось определить участника. Обновите арену.");return}
    try{
      const result=await window.FaceArenaSync.submitVote(b2.battleUid,targetPhotoId,v);
      busy=false;closeV();window.FaceArenaAudio?.play("voteSuccess");
      toast(result?.ok===false?"Голос принят. Серверный таймер временно недоступен.":t("ok"));
      if(location.hash==="#battle-"+n)bview(n);
    }catch(error){
      busy=false;
      const send=$("sd");if(send){send.disabled=false;send.textContent=t("send")}
      const err=$("er");if(err)err.textContent=error?.message||"Не удалось отправить голос";
    }
    return;
  }
  VOTED.add(b2.battleUid);
  if(side==="R")b2.redVotes++;else b2.blueVotes++;
  (MY[b2.battleUid]=MY[b2.battleUid]||[]).unshift({s:side,v});
  busy=false;closeV();
  saveState();
  window.FaceArenaAudio?.play("voteSuccess");
  bview(n);renderArenaGrid();toast(t("ok"));
}

  }
  

  $("qv").innerHTML=`

<div class="q-pos"><div class="big-n">${posHtml}</div><div class="lbl">${t("qPos")}</div></div>

    if(paired){paired.status="queued";paired.battleId=null;paired.battleUid=null;paired.targetLaneId=null;paired.matchedAt=null;paired.matchDeadline=null;paired.side=null;paired.opponentName=null;paired.opponentImg=null;paired.openingPairPrimaryId=null;}
    p.status="queued";p.matchedAt=null;p.matchDeadline=null;p.targetLaneId=null;p.opponentName=null;p.opponentImg=null;p.side=null;p.openingOpponentPhotoId=null;p._confirming=false;
    toast(t("matchCancelOk"));saveState();location.hash="queue";
  };
  clearInterval(matchTimerId);
  matchTimerId=setInterval(()=>{
    if(p.status!=="matched"){clearInterval(matchTimerId);return}
    const l=Math.max(0,Math.ceil((p.matchDeadline-Date.now())/1000));
    const el=$("mcd");if(el)el.textContent=l;
    if(l<=0){clearInterval(matchTimerId);confirmMatch(p)}
  },250);
}

function findFreeSlot(photo){
  if(photo&&photo.targetLaneId){
    const target=arenaBattles.find(b=>String(b.id)===String(photo.targetLaneId));
    if(target&&!target.userPhotoId&&(target.stage==="done"||target.stage==="cancelled"||target.stage==="empty"))return target;
  }
  return arenaBattles.filter(b=>!b.userPhotoId&&(b.stage==="done"||b.stage==="cancelled"||b.stage==="empty")).sort((a,b)=>Number(a.id)-Number(b.id))[0]||null;
}
function clearSlot(slot, preserveChampion){
  // New battle identity — never reuse votes/comments
  const champ={
    championPhotoId:slot.championPhotoId,
    championSide:slot.championSide,
    championStreak:slot.championStreak,
    championName:slot.championName,
    championImg:slot.championImg
  };
  slot.userPhotoId=null;
  slot.openingOpponentPhotoId=null;slot.openingOpponentName=null;slot.openingOpponentImg=null;
  slot.battleUid=null;
  slot.isMock=false;
  slot.redVotes=0;slot.blueVotes=0;
  slot.redName="—";slot.blueName="—";
  slot.stage="empty";
  slot.stageEnd=0;slot.stageStarted=0;
  slot._finalized=false;
  if(preserveChampion&&champ.championPhotoId){
    Object.assign(slot, champ);
  } else if(!preserveChampion){
    slot.championPhotoId=null;slot.championSide=null;slot.championStreak=0;slot.championName=null;slot.championImg=null;
  }
}
function confirmMatch(p){
  if(!p||p.status!=="matched")return;
  if(p._confirming)return; // prevent duplicate
  p._confirming=true;
  clearInterval(matchTimerId);
  const slot=findFreeSlot(p);
  if(!slot){
    p.status="queued";
    p.matchedAt=null;p.matchDeadline=null;p.targetLaneId=null;
    p.opponentName=null;p.opponentImg=null;p.side=null;
    p._confirming=false;
    toast("Нет свободных слотов на арене. Фото вернулось в очередь.");
    saveState();
    location.hash="queue";
    return;
  }
  const keepChamp=!!slot.championPhotoId;
  const openingOpponent=p.openingOpponentPhotoId?photos.find(x=>String(x.id)===String(p.openingOpponentPhotoId)):null;
  if(p.openingOpponentPhotoId&&!openingOpponent){
    p.status="queued";p.targetLaneId=null;p.matchDeadline=null;p.matchedAt=null;p.openingOpponentPhotoId=null;p._confirming=false;saveState();return;
  }
  clearSlot(slot, keepChamp);
  const uid=newBattleUid();
  p.status="confirmed";
  p.battleId=slot.id; // slot number for navigation
  p.targetLaneId=null;
  p.battleUid=uid;    // immutable instance id
  p.matchDeadline=null;
  p._confirming=false;
  slot.isMock=false;
  slot.userPhotoId=p.id;
  slot.battleUid=uid;
  if(openingOpponent){
    slot.openingOpponentPhotoId=openingOpponent.id;
    slot.openingOpponentName=openingOpponent.name||"Участник";
    slot.openingOpponentImg=openingOpponent.dataUrl||"";
    openingOpponent.status="confirmed";openingOpponent.battleId=slot.id;openingOpponent.battleUid=uid;
    openingOpponent.targetLaneId=null;openingOpponent.matchDeadline=null;openingOpponent.matchedAt=Date.now();
    openingOpponent.side="B";openingOpponent.openingPairPrimaryId=null;
  }
  slot.stage="w";
  slot.stageEnd=Date.now()+STAGE_SEC*1000;
  slot.stageStarted=Date.now();
  slot.redVotes=0;slot.blueVotes=0;
  slot._finalized=false;
  // If lane has champion, challenger is opposite side
  if(openingOpponent){
    p.side="R";p.opponentName=openingOpponent.name||"Участник";p.opponentImg=openingOpponent.dataUrl||"";
    slot.redName=profile.name||"Участник";slot.blueName=openingOpponent.name||"Участник";
  }else if(slot.championPhotoId&&String(slot.championPhotoId)!==String(p.id)){
    p.side=slot.championSide==="R"?"B":"R";
    p.opponentName=slot.championName||p.opponentName;
    p.opponentImg=slot.championImg||p.opponentImg;
  }
  if(p.side==="R"){slot.redName="you";slot.blueName=(p.opponentName||"opp").replace("@","")}
  else{slot.blueName="you";slot.redName=(p.opponentName||"opp").replace("@","")}
  // Self-challenge guard
  if(slot.championPhotoId&&String(slot.championPhotoId)===String(p.id)){
    p.status="queued";p.battleId=null;p._confirming=false;
    toast("Нельзя бросить вызов самому себе");
    saveState();location.hash="queue";return;
  }
  toast(t("matchConfirm"));
  window.FaceArenaAudio?.play("impact");
  saveState();
  renderArenaGrid();
  if(location.hash==="#match-"+encodeURIComponent(p.id))location.hash="queue";
}

function handleFile(f){
  if(!f)return;
  if(!["image/jpeg","image/png","image/webp"].includes(f.type)){toast(t("upBadType"));pendingUrl=null;pendingFile=null;renderUpload();return}
  if(f.size>MAX_SIZE){toast(t("upBadSize"));pendingUrl=null;pendingFile=null;renderUpload();return}
  const reader=new FileReader();
  reader.onerror=()=>{toast("Ошибка чтения файла");pendingUrl=null;pendingFile=null;renderUpload()};
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      try{
        if(!img.width||!img.height){toast("Некорректное изображение");return}
        const maxW=900;
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");
        if(!ctx){pendingUrl=e.target.result;pendingFile=f;renderUpload();return}
        ctx.drawImage(img,0,0,w,h);
        pendingUrl=c.toDataURL("image/jpeg",0.85);
        pendingFile=f;
        renderUpload();
      }catch(err){
        toast("Не удалось обработать изображение");
        pendingUrl=null;pendingFile=null;renderUpload();
      }
    };
    img.onerror=()=>{toast("Не удалось загрузить изображение");pendingUrl=null;pendingFile=null;renderUpload()};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

async function confirmAdd(){
  if(!pendingUrl){toast(t("upNoFile"));return}
  if(activeCount()>=MAX_ACTIVE){toast(t("upLimit"));return}
  if(window.FaceArenaSync?.isOnline()){
    try{
      const result=await window.FaceArenaSync.uploadPhoto(pendingFile);
      pendingFile=null;pendingUrl=null;
      toast(result?.coordinatorAvailable===false?"Фото сохранено. Серверный таймер временно недоступен.":"Фото добавлено в общую очередь");
      location.hash="queue";
    }catch(error){toast(error?.message||"Не удалось загрузить фото");}
    return;
  }
  const id=Date.now()+"_"+Math.random().toString(36).slice(2,8);
  photos.push({id,dataUrl:pendingUrl,status:"queued",queuedAt:Date.now(),queueSeq:photos.reduce((m,x)=>Math.max(m,Number.isFinite(x.queueSeq)?x.queueSeq:-1),-1)+1});
  tryFillSlots();
  pendingFile=null;pendingUrl=null;
  toast(t("upOk")+" → смотрите во вкладке «Очередь»");
  try{saveState()}catch(e){toast("Фото добавлено, но сохранение не удалось");}
  updateArenaStats();
  location.hash="queue";
}

      else if(go==="sound")showSub("setSubSound");
      else if(go==="notifications")showSub("setSubNotifications");
      else if(go==="privacy")showSub("setSubPrivacy");
      else if(go==="data")showSub("setSubData");
      else if(go==="support")showSub("setSubSupport");
      else if(go==="signout")window.FaceArenaSync?.signOut();
    };
  });

  ["backFromProfile","backFromAnim","backFromSound","backFromNotifications","backFromPrivacy","backFromData","backFromSupport"].forEach(id=>{
    const el=$(id);if(el)el.onclick=showMain;
  });

  const closeSettings=()=>{location.hash=""};
  const cx=$("setCloseX");if(cx)cx.onclick=closeSettings;
  const ex=$("setExit");if(ex)ex.onclick=closeSettings;

  const resetBtn=$("setResetBtn");
  if(resetBtn)resetBtn.onclick=resetData;

  const audio=window.FaceArenaAudio;
  if(audio){
    const soundSettings=audio.getSettings();
    const togSound=$("togSound"),soundVolume=$("soundVolume"),soundValue=$("soundVolumeValue"),soundPreview=$("soundPreview");
    const syncSound=()=>{
      const current=audio.getSettings();
      if(togSound){togSound.classList.toggle("on",current.enabled);togSound.setAttribute("aria-pressed",String(current.enabled));}
      if(soundVolume)soundVolume.value=String(current.volume);
      if(soundValue)soundValue.textContent=current.volume+"%";
    };
    syncSound();
    if(togSound)togSound.onclick=()=>{audio.setEnabled(!audio.getSettings().enabled);syncSound();};
    if(soundVolume)soundVolume.oninput=()=>{audio.setVolume(Number(soundVolume.value));if(soundValue)soundValue.textContent=soundVolume.value+"%";};
    if(soundPreview)soundPreview.onclick=()=>{
      soundPreview.disabled=true;
      const originalLabel="Прослушать";
      audio.preview().then(ok=>{
        soundPreview.disabled=false;
        soundPreview.textContent=ok?originalLabel:"Звук недоступен";
        if(!ok)setTimeout(()=>{soundPreview.textContent=originalLabel;},1800);
      }).catch(()=>{
        soundPreview.disabled=false;
        soundPreview.textContent="Звук недоступен";
        setTimeout(()=>{soundPreview.textContent=originalLabel;},1800);
      });
    };
  }

  const ta=$("togAnim");
  if(ta)ta.onclick=()=>{
    prefAnim=!prefAnim;
    applyAnimPref();
    saveState();
    ta.classList.toggle("on",prefAnim);
    ta.setAttribute("aria-pressed",String(prefAnim));
    toast(prefAnim?"Анимации включены":"Анимации отключены");
  };

  const sp=$("saveProfile");
  if(sp)sp.onclick=async()=>{
    const name=($("setName").value||"").trim().slice(0,24);
    const handle=($("setHandle").value||"").trim().replace(/^@/,"").replace(/[^\w.]/g,"").slice(0,20);
    if(!name){toast("Укажите имя");return}
    if(!handle){toast("Укажите никнейм");return}
    if(window.FaceArenaSync?.isOnline()){
      try{await window.FaceArenaSync.updateProfile(name,handle)}catch(error){toast(error?.message||"Не удалось сохранить профиль");return}
    }
    profile={name,handle};
    saveState();
    toast("Профиль сохранён");
    showMain();
  };
}

function historyResultKey(h,index){
  return String(h.resultId||(h.battleUid?String(h.battleUid)+":"+String(h.photoId):String(h.photoId)+":"+String(h.completedAt||index)));
}
function renderResults(){
  const rows=(arenaResults.length?arenaResults:history).map((h,i)=>({...h,_resultKey:historyResultKey(h,i)}));
  const content=rows.length?'<div class="hist">'+rows.map(h=>`
    <div class="hist-item" role="button" tabindex="0" data-result="${esc(h._resultKey)}">
      <div class="sides">
        <img src="${h.myImg||face(1,"R")}" alt="">
        <span class="vs-s">VS</span>
        <img src="${h.opponentImg||face(2,"B")}" alt="">
      </div>
      <div style="text-align:right">
        <div class="res ${esc(h.result)}">${h.result==="red"?"Победа RED":h.result==="blue"?"Победа BLUE":h.result==="win"?t("prWin"):h.result==="lose"?t("prLose"):"Ничья"}</div>
        <div style="font-size:11px;color:var(--mu);margin-top:2px">${Number(h.myVotes)||0} : ${Number(h.oppVotes)||0}</div>
        <div style="font-size:10px;color:var(--mu);margin-top:3px">Баттл №${esc(h.battleId||h.laneId||"—")}</div>
      </div>
    </div>`).join("")+'</div>':'<div class="empty-box"><p>Завершённые баттлы появятся здесь.</p></div>';
  $("iv").innerHTML=`
    ${hdrHTML()}
    <h1 class="sec-h">Итоги</h1>
    <p class="sec-lead">Результаты завершённых баттлов. Записи остаются здесь после освобождения активных слотов.</p>
    ${content}`;
  $("iv").querySelectorAll("[data-result]").forEach(el=>{
    const open=()=>{location.hash="result-"+encodeURIComponent(el.dataset.result)};
    el.onclick=open;
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
  });
}

function renderResult(photoId){
  const h=(arenaResults||[]).find((x,i)=>historyResultKey(x,i)===String(photoId))||history.find((x,i)=>historyResultKey(x,i)===String(photoId))||history.find(x=>String(x.photoId)===String(photoId));
  if(!h){location.hash="profile";return}
  $("rv").innerHTML=`
    ${hdrHTML()}
    <button class="back" id="bkR">← ${t("resBack")}</button>
    <h1 class="sec-h">${t("resTitle")}</h1>
<div class="result-detail">
      <div class="match-duel">
        <div><img src="${h.myImg}" alt=""><div style="font-size:12px;margin-top:6px">RED · ${esc(h.myName||"Участник")}</div></div>
        <div><img src="${h.opponentImg}" alt=""><div style="font-size:12px;margin-top:6px">BLUE · ${esc(h.opponentName||"Участник")}</div></div>
      </div>
      <div class="score" style="color:${h.result==="red"?"var(--red)":h.result==="blue"?"var(--blue)":h.result==="win"?"#4ade80":h.result==="lose"?"var(--red)":"var(--mu)"}">${h.result==="red"?"Победа RED":h.result==="blue"?"Победа BLUE":"Ничья"}</div>
      <div style="text-align:center;font:800 20px var(--hd)">${h.myVotes} : ${h.oppVotes}</div>
      <p class="note" style="text-align:center">Баттл №${h.battleId} · ${new Date(h.completedAt).toLocaleString("ru")}</p>
    </div>`;
  $("bkR").onclick=()=>{location.hash="profile"};
}

const views={av:$("av"),bv:$("bv"),qv:$("qv"),uv:$("uv"),pv:$("pv"),sv:$("sv"),mv:$("mv"),rv:$("rv"),iv:$("iv")};
function hideAll(){Object.values(views).forEach(v=>{if(v){v.hidden=true;v.classList.remove("is-on","is-leave","settings-menu")}})}
function setTab(i){
  document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("on",j===i));
  $("ind").style.transform=`translateX(${i*100}%)`;
  $("ind").style.width="20%";
}
function showView(el){
  if(!el)return;
  el.hidden=false;
  el.classList.remove("is-leave");
  requestAnimationFrame(()=>{el.classList.add("is-on")});
}
let _navLock=false;
function show(){
  if(_navLock)return;
  const hash=location.hash.slice(1)||"";
  closeV();
  // Match timer cleared inside renderMatch / when leaving match; avoid double-clear race
  const reduce=!prefAnim||document.documentElement.classList.contains("no-anim")||window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const current=Object.values(views).find(v=>v&&!v.hidden&&v.classList.contains("is-on"));
  const go=()=>{
    hideAll();
    let target=null;
    if(/^battle-(\d+)$/.test(hash)){
      const n=+RegExp.$1;
      if(n>=1&&n<=arenaBattles.length){bview(n);target=views.bv;setTab(0);tick2()}
    } else if(/^match-(.+)$/.test(hash)){
      renderMatch(decodeURIComponent(RegExp.$1));target=views.mv;setTab(1);
    } else if(/^result-(.+)$/.test(hash)){
      renderResult(decodeURIComponent(RegExp.$1));target=views.rv;setTab(3);
    } else if(hash==="queue"){renderQueue();target=views.qv;setTab(1)}
    else if(hash==="upload"){renderUpload();target=views.uv;setTab(2)}
    else if(hash==="profile"){renderProfile();target=views.pv;setTab(3)}
    else if(hash==="results"){renderResults();target=views.iv;setTab(4)}
    else if(hash==="settings"){renderSettings();target=views.sv;setTab(3)}
    else {renderArenaGrid();target=views.av;setTab(0)}
    if(target!==views.mv)clearInterval(matchTimerId);
    if(target)showView(target);
    // Hide bottom nav on settings (full-screen menu)
    const navEl=document.querySelector("nav");
    if(navEl)navEl.style.display=(hash==="settings")?"none":"";
    bindGear();
    window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
    _navLock=false;
  };
  // Instant switch — CSS handles the short fade, no artificial delay
  go();
}

addEventListener("hashchange",show);
window.addEventListener("face-arena-snapshot",event=>{
  const snapshot=event.detail;
  if(!snapshot)return;
  photos=snapshot.photos||[];
  arenaBattles=snapshot.arenaBattles||createDefaultArena();
  history=snapshot.history||[];
  arenaResults=snapshot.arenaResults||[];
  VOTED=snapshot.VOTED||new Set();
  MY=snapshot.MY||{};
  profile=snapshot.profile||profile;
  participantStats=snapshot.participantStats||{};
  updateArenaStats();
  const hash=location.hash.slice(1);
  if(hash==="results")renderResults();
  else if(hash.startsWith("result-"))renderResult(decodeURIComponent(hash.slice(7)));
  else if(/^battle-\d+$/.test(hash))bview(Number(hash.slice(7)));
  else if(hash==="queue")renderQueue();
  else if(hash==="profile")renderProfile();
  else renderArenaGrid();
});
renderArenaGrid();
show();
setInterval(()=>{tickArena();tick2()},1000);

const IC={
  results:'<path d="M4 5h16M4 12h16M4 19h16"/><path d="m7 9 2 2 4-4"/>',
  arena:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
  q:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  up:'<path d="M12 5v14M5 12h14"/>',
  pr:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'
};
["arena","q","up","pr","results"].forEach((k,i)=>{
  const b=document.createElement("button");
  if(!i)b.className="on";
  b.innerHTML=`<svg viewBox="0 0 24 24">${IC[k]}</svg>${t(k)}`;
  b.onclick=()=>{
    if(i===0)location.hash="";
    else if(i===1)location.hash="queue";
    else if(i===2)location.hash="upload";
    else if(i===3)location.hash="profile";
    else location.hash="results";
  };
  $("tabs").appendChild(b);
});
// Restore FIFO progression for queued photos from an existing LocalStorage session.
tryFillSlots();
saveState();
</script>
